spring.application.name=supermercado-mcp
server.port=8888
# Solo accesible desde esta maquina: el endpoint MCP no tiene autenticacion
server.address=127.0.0.1

# Servidor MCP con transporte Streamable HTTP en http://localhost:8888/mcp
spring.ai.mcp.server.name=supermercado-mcp-server
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC
spring.ai.mcp.server.protocol=STREAMABLE
spring.ai.mcp.server.stdio=false
spring.ai.mcp.server.streamable-http.mcp-endpoint=/mcp

# Las credenciales vienen de variables de entorno (archivo .env, que no se sube a git)
spring.datasource.url=jdbc:mysql://localhost:${DB_PORT:3306}/supermercado_mcp?serverTimezone=America/Bogota
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# El esquema lo definen los scripts de db/init; Hibernate solo comprueba que las entidades coincidan
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

logging.file.name=./logs/supermercado-mcp.log
logging.level.org.springframework.ai=DEBUG

# Tarifa fija de envio en pesos colombianos
supermercado.costo-envio=5000
