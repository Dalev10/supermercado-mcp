spring.application.name=chatbot-client
server.port=8080
# Solo accesible desde esta maquina
server.address=127.0.0.1

# Gemini Developer API con API key. No definir project-id ni location: cambian el modo a Vertex AI.
spring.ai.google.genai.api-key=${GEMINI_API_KEY}
# El modelo se puede cambiar sin tocar codigo con la variable GEMINI_MODEL
spring.ai.google.genai.chat.options.model=${GEMINI_MODEL:gemini-3.5-flash-lite}

# Cliente MCP: se conecta por Streamable HTTP al servidor, que debe estar arriba antes de arrancar el chatbot
spring.ai.mcp.client.name=supermercado-chatbot
spring.ai.mcp.client.type=SYNC
spring.ai.mcp.client.request-timeout=30s
spring.ai.mcp.client.streamable-http.connections.supermercado.url=http://localhost:8888
spring.ai.mcp.client.streamable-http.connections.supermercado.endpoint=/mcp

logging.file.name=./logs/chatbot-client.log
